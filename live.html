<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公車即時動態</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{--bg:#0b1020;--panel:#121a30;--panel-2:#0e1526;--line:#22304f;--ink:#e7edfb;--ink-dim:#7f8fb5;--ink-faint:#4c5c82;
    --go:#ec2c8a;--back:#2aa9ff;--bus:#f9a825;--accent:#3ce0cf;--pin:#2b5c88;--live:#5fe08a;--warn:#ffb454;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 80% -10%,#16213f 0%,transparent 60%),var(--bg);
    color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:36px 22px 60px;}
  .card{background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);
    border-radius:18px;padding:12px;box-shadow:0 24px 60px -30px rgba(0,0,0,.9);margin-bottom:16px;}
  .card.bare{background:none;border:none;border-radius:0;padding:0;box-shadow:none;margin:0;}
  body.map-only{background:none;}
  body.map-only .wrap{max-width:none;padding:0;margin:0;}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;}
  .legend{display:flex;gap:14px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:11px;}
  .legend i{width:16px;height:4px;border-radius:2px;}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);}
  .live b{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,224,138,.5)}70%{box-shadow:0 0 0 7px rgba(95,224,138,0)}100%{box-shadow:0 0 0 0 rgba(95,224,138,0)}}
  .stage{border-radius:11px;overflow:hidden;background:#dcdcdc;transition:border-radius .3s;}
  .stage.follow{max-width:100%;}
  .stage.follow.shape-round{border-radius:30px;}
  .stage.follow.shape-circle{border-radius:50%;}
  svg.map{display:block;width:100%;height:auto;}
  .settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 6px 10px;}
  .seg{display:flex;background:#0a1122;border:1px solid var(--line);border-radius:9px;padding:3px;}
  .segbtn{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:5px 10px;border:none;background:none;color:var(--ink-dim);border-radius:6px;cursor:pointer;}
  .segbtn.on{background:var(--accent);color:#08111f;font-weight:600;}
  .go-line{fill:none;stroke:var(--go);stroke-width:var(--line-w,11);stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .back-line{fill:none;stroke:var(--back);stroke-width:var(--line-w,11);stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .lbl-link{display:none;}
  .stop-ring{stroke:#fff;stroke-width:4;transition:fill .3s;}
  .stop-core{fill:#fff;}
  .lbl-badge{fill:var(--pin);}
  .lbl-badge-num{font-family:"IBM Plex Mono";font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central;}
  .lbl-name{font-family:"Noto Sans TC";font-weight:700;fill:#17233f;paint-order:stroke;stroke:#f4f6fb;stroke-width:7;stroke-linejoin:round;dominant-baseline:middle;}
  .bus-core{fill:var(--bus);}
  .bus-pulse{transform-box:fill-box;transform-origin:center;animation:busPulse 2s ease-out infinite;}
  @keyframes busPulse{0%{transform:scale(1);opacity:.45;}70%{opacity:0;}100%{transform:scale(2.6);opacity:0;}}
  .bus-num{font-family:"IBM Plex Mono";font-weight:600;/*fill:#3a2400;*/text-anchor:middle;}
  .bus-plate{font-family:"IBM Plex Mono";font-weight:600;fill:#17233f;paint-order:stroke;stroke:#f4f6fb;stroke-width:8;stroke-linejoin:round;}
  .status h2,.log h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);margin:2px 4px 12px;font-weight:500;}
  .srow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-top:1px solid #1a2540;}
  .srow:first-of-type{border-top:none;}
  .stag{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px;background:var(--bus);
    color:#3a2400;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;}
  .smeta{min-width:0;flex:1;} .sstate{font-size:14.5px;font-weight:700;}
  .ssub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .d-dwell{background:var(--live);} .d-run{background:var(--accent);} .d-near{background:var(--warn);}
  .log .lines{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.85;color:var(--ink-dim);max-height:150px;overflow:hidden;}
  .log .lines b{color:var(--ink);} .log .arr{color:var(--live);} .log .dep{color:var(--warn);}
</style>
</head>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");

const routeMode="split";
const COL={go:"#ec2c8a",back:"#2aa9ff",single:"#7c3aed"};
const VIEW_MODE="full";
const FRAME_SHAPE="rect";
const FRAME_CORNER=30;
const FOLLOW_ZOOM=2.2;
const FOLLOW_W=320;
const FOLLOW_H=320;
const FOLLOW_FILL=false;
const BUS_FX="multi";
const BUS_STYLE="arrow";
const BUS_ICON_SVG="";
const BUS_ARROW_SVG="<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg id=\"_圖層_1\" data-name=\"圖層_1\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" viewBox=\"0 0 512 512\">\n  <!-- Generator: Adobe Illustrator 29.8.10, SVG Export Plug-In . SVG Version: 2.1.1 Build 2)  -->\n  <g id=\"_x30_7_Arrow_Right\">\n    <path d=\"M423.1,281.7l-245.8,140.6c-23.8,13.6-51.8-9.9-42.5-35.7l75.5-130.6-75.5-130.6c-9.4-25.9,18.6-49.3,42.5-35.7l245.8,140.6c19.9,11.3,19.8,40,0,51.3Z\"/>\n  </g>\n</svg>";
const BUS_SCALE=1;
const BUS_BG="#f9a825";
const BUS_FG="#000000";
const BUS_STROKE="#ffffff";
const BUS_STROKE_W=5;
const BUS_NO_CORE=false;
const BUS_NO_RING=false;
const LABEL_SCALE=1;
const STOP_SCALE=1;
const LINE_WIDTH=11;
const LAYOUT="card";
const FEEDS=[{"id":"s1","url":"https://wa-smart-busstop-v2.azurewebsites.net/api/Phase4/getCmServiceBus?licsno=PA4","primary":true}];
const FEED={"mode":"distance","primary":"s1","listPath":"data.goThrouth","etaType":"seconds","fields":{"sort":"sort","arrived":"arrived","distNext":"distanceToNextPoint","distStop":"distanceToStop","percent":"","eta":"","stopLat":"lat","stopLon":"lon","success":"isSuccess","plate":"","busLat":"","busLon":"","now":"","etaType":"seconds"},"src":{"success":"","plate":"","busLat":"","busLon":"","now":""}};
const CORNER_R=10;
const STOPS={
  water:{x:705,y:256,lx:739,ly:205,nx:709,ny:205,name:"水湳轉運中心",num:"1"},
  park_o:{x:837,y:1254,lx:522,ly:1261,nx:783,ny:1256,name:"臺中中央公園(去)",num:"2"},
  wenhua:{x:1013,y:1877,lx:1090,ly:1900,nx:1060,ny:1900,name:"捷運文華高中站",num:"3"},
  park_r:{x:869,y:1255,lx:950,ly:1261,nx:920,ny:1258,name:"臺中中央公園(返)",num:"4"},
  green:{x:819,y:527,lx:590,ly:535,nx:770,ny:531,name:"臺中綠美圖",num:"5"},
  liming:{x:764,y:367,lx:871,ly:370,nx:841,ny:370,name:"黎明經貿路口(會展中心)",num:"6"},
};
const GO_PTS=[[693,261],[732,243],[900,556],[840,588],[868,683],[882,899],[890,1142],[815,1339],[796,1425],[786,1557],[1024,1560],[1061,1625],[1132,1828],[1012,1873]];
const BACK_PTS=[[1012,1874],[933,1909],[850,1958],[811,1683],[801,1558],[812,1426],[830,1345],[906,1145],[897,880],[884,685],[853,581],[730,386],[806,352],[798,339],[746,364],[691,261]];

// 站點順序:用 STOPS 的鍵順序,末端回到第一站收成環線
const ORDER=[...Object.keys(STOPS), Object.keys(STOPS)[0]];
document.documentElement.style.setProperty("--line-w",(typeof LINE_WIDTH!=="undefined")?LINE_WIDTH:11);

function line(pts,r){
  if(!r||r<=0) return "M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
  let d="M "+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const lAB=Math.hypot(b[0]-a[0],b[1]-a[1])||1,lBC=Math.hypot(c[0]-b[0],c[1]-b[1])||1,rr=Math.min(r,lAB/2,lBC/2);
    const p1=[b[0]-(b[0]-a[0])/lAB*rr,b[1]-(b[1]-a[1])/lAB*rr],p2=[b[0]+(c[0]-b[0])/lBC*rr,b[1]+(c[1]-b[1])/lBC*rr];
    d+=" L "+p1[0].toFixed(1)+" "+p1[1].toFixed(1)+" Q "+b[0]+" "+b[1]+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d+" L "+pts[pts.length-1][0]+" "+pts[pts.length-1][1];
}
const goPath=document.getElementById("goPath");   goPath.setAttribute("d",line(GO_PTS,CORNER_R));
const backPath=document.getElementById("backPath"); backPath.setAttribute("d",line(BACK_PTS,CORNER_R));
const goLen=goPath.getTotalLength(),backLen=backPath.getTotalLength(),total=goLen+backLen;
function pointAtDist(dist){ if(dist<=goLen) return {p:goPath.getPointAtLength(dist),leg:"go"};
  return {p:backPath.getPointAtLength(Math.min(dist-goLen,backLen)),leg:"back"}; }

// 各站在環線上的弧長:沿環線單調前進搜尋最近點(自動解決去/返同區的歸屬)
const ORDER_DIST=(function(){
  const res=[]; let prev=0;
  ORDER.forEach((k,idx)=>{
    if(idx===0){res.push(0);prev=0;return;}
    if(idx===ORDER.length-1){res.push(total);return;}
    const s=STOPS[k]; let best=prev,bd=Infinity;
    for(let d=prev; d<=total; d+=6){ const q=pointAtDist(d).p; const dd=(q.x-s.x)*(q.x-s.x)+(q.y-s.y)*(q.y-s.y); if(dd<bd){bd=dd;best=d;} }
    res.push(best); prev=best;
  });
  return res;
})();

function applyColors(){
  const root=document.documentElement.style;
  if(routeMode==="single"){root.setProperty("--go",COL.single);root.setProperty("--back",COL.single);}
  else{root.setProperty("--go",COL.go);root.setProperty("--back",COL.back);}
  document.getElementById("legend").innerHTML = routeMode==="single"
    ? '<span><i style="background:var(--go)"></i>路線</span>'
    : '<span><i style="background:var(--go)"></i>去程</span><span><i style="background:var(--back)"></i>回程</span>';
}
function busColor(leg){ return routeMode==="single"?COL.single:(leg==="go"?COL.go:COL.back); }

// ★★★ 接真實資料的入口:onEvent(車, "ARRIVE"/"DEPART") 控站別;onEvent(車,"ETA",秒數) 控速率 ★★★
function onEvent(bus,type,value){
  if(type==="DEPART"){bus.phase="transit";bus.p=0;bus.arriving=false;}
  else if(type==="ARRIVE"){bus.arriving=true;}
  else if(type==="ETA"){bus.eta=value;}          // 預估到站秒數 → 控制行駛速率
  if(type!=="ETA") logEvent(bus,type);
}

let last=performance.now(),tick=0;
function frame(now){ const dt=Math.min((now-last)/1000,.05);last=now; const N=ORDER.length-1; let primary=null;
  buses.forEach(b=>{
    if(DATA_DRIVEN){
      if(b.gpsMode){ if(b.targetDist!=null){ if(b.dist==null)b.dist=b.targetDist; b.dist+=(b.targetDist-b.dist)*Math.min(1,dt*3); } b.phase="transit"; }
      else if(b.paceEta){ if(b.eta!=null){ b.eta=Math.max(0,b.eta-dt); const remain=1-b.p, dp=b.eta>dt?remain*(dt/b.eta):remain; b.p=Math.min(0.97,b.p+dp); }
        b.phase=b.p<0.03?"dwell":"transit"; b.dist=busDist(b); }
      else { if(b.targetP!=null) b.p+=(b.targetP-b.p)*Math.min(1,dt*3); b.phase=b.p<0.03?"dwell":"transit"; b.dist=busDist(b); }
    } else if(b.phase==="transit"){
      if(b.arriving){ b.p+=(1-b.p)*Math.min(1,dt*6)+dt*0.2;
        if(b.p>=0.999){b.seg=(b.seg+1)%N;b.phase="dwell";b.p=0;b.arriving=false;b.eta=null;scheduleDepart(b);} }
      else if(b.eta!=null){ b.eta=Math.max(0,b.eta-dt); const remain=1-b.p, dp=b.eta>dt?remain*(dt/b.eta):remain; b.p=Math.min(0.97,b.p+dp); }
      else b.p=Math.min(CAP,b.p+CREEP*dt);
      b.dist=busDist(b);
    } else b.dist=busDist(b);
    const r=pointAtDist(b.dist||0); b.g.setAttribute("transform","translate("+r.p.x+","+r.p.y+") scale("+(markerK*BUS_SCALE_V)+")");
    if(b.ring) b.ring.setAttribute("stroke",busColor(r.leg)); b.pulses.forEach(p=>p.setAttribute("fill",busColor(r.leg)));
    if(b.arrowEl){ const q=pointAtDist(Math.min(total,(b.dist||0)+6)).p, dx=q.x-r.p.x, dy=q.y-r.p.y;
      if(dx*dx+dy*dy>0.25){ const ang=Math.atan2(dy,dx)*180/Math.PI; if(b.heading==null)b.heading=ang; const dd=((ang-b.heading+540)%360)-180; b.heading+=dd*Math.min(1,dt*8); }
      if(b.heading!=null) b.arrowEl.setAttribute("transform","rotate("+b.heading.toFixed(1)+")"); }
    if(b===buses[0]) primary=r.p;
  });
  if(primary){ lastBusPos.x=primary.x; lastBusPos.y=primary.y;
    if(viewMode==="follow"){
      cam.x+=(primary.x-cam.x)*Math.min(1,dt*4); cam.y+=(primary.y-cam.y)*Math.min(1,dt*4);
      let vx=cam.x-winW/2, vy=cam.y-winH/2;
      vx=FULL_VB[2]>winW?Math.max(FULL_VB[0],Math.min(FULL_VB[0]+FULL_VB[2]-winW,vx)):FULL_VB[0]+(FULL_VB[2]-winW)/2;
      vy=FULL_VB[3]>winH?Math.max(FULL_VB[1],Math.min(FULL_VB[1]+FULL_VB[3]-winH,vy)):FULL_VB[1]+(FULL_VB[3]-winH)/2;
      svg.setAttribute("viewBox",vx+" "+vy+" "+winW+" "+winH);

}
// ===== 資料來源:依 FEED 設定解析任意 API(方案A 模式對應 / 方案D 自訂函式)=====
const FEEDS_V=(typeof FEEDS!=="undefined")?FEEDS:[];
const FEED_V=(typeof FEED!=="undefined")?FEED:null;
const HAS_FEED=FEEDS_V.length>0 && FEEDS_V.some(f=>f.url) && !!FEED_V;
const DATA_DRIVEN=HAS_FEED;
function getPath(o,p){ if(!p) return undefined; return String(p).split(".").reduce((a,k)=>(a==null?undefined:a[k]),o); }
function pushLog(bus,txt){ if(!logEl) return;
  const t=new Date().toLocaleTimeString("zh-TW",{hour12:false});
  logs.unshift(t+"  <b>["+bus.id+"]</b> "+txt); logs.length=Math.min(logs.length,8); logEl.innerHTML=logs.join("<br>");
}
function solve3(M,b){ const A=M.map((r,i)=>[r[0],r[1],r[2],b[i]]);
  for(let i=0;i<3;i++){ let piv=i; for(let r=i+1;r<3;r++) if(Math.abs(A[r][i])>Math.abs(A[piv][i])) piv=r; const tmp=A[i];A[i]=A[piv];A[piv]=tmp;
    const d=A[i][i]||1e-9; for(let c=i;c<4;c++) A[i][c]/=d;
    for(let r=0;r<3;r++) if(r!==i){ const fct=A[r][i]; for(let c=i;c<4;c++) A[r][c]-=fct*A[i][c]; } }
  return [A[0][3],A[1][3],A[2][3]]; }
function solveAffine(src,dst){ const A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
  for(let i=0;i<src.length;i++){ const r=[src[i][0],src[i][1],1],X=dst[i][0],Y=dst[i][1];
    for(let a=0;a<3;a++){ for(let b=0;b<3;b++) A[a][b]+=r[a]*r[b]; bx[a]+=r[a]*X; by[a]+=r[a]*Y; } }
  const cx=solve3(A,bx),cy=solve3(A,by); return {ax:cx[0],bx:cx[1],cx:cx[2],ay:cy[0],by:cy[1],cy:cy[2]}; }
function applyAffine(t,lon,lat){ return {x:t.ax*lon+t.bx*lat+t.cx, y:t.ay*lon+t.by*lat+t.cy}; }
function nearestDist(mx,my){ let best=0,bd=Infinity; for(let d=0;d<=total;d+=8){ const q=pointAtDist(d).p; const dd=(q.x-mx)*(q.x-mx)+(q.y-my)*(q.y-my); if(dd<bd){bd=dd;best=d;} } return best; }
function feedCompute(res, sv, samples){             // res=主來源;sv(key)=取單值(可挑來源)
  if(!FEED_V) return null; sv=sv||(()=>undefined);
  if(FEED_V.mode==="custom"){
    try{ const fn=new Function("primary","sources",FEED_V.transform||"return null;"); const r=fn(res, samples||{}); return (r&&r.seg!=null)?{seg:r.seg,p:(r.p||0)}:null; }
    catch(e){ return null; }
  }
  const list=getPath(res,FEED_V.listPath); if(!Array.isArray(list)||!list.length) return null;
  const f=FEED_V.fields||{}, N=ORDER.length-1;
  const stops=f.sort?[...list].sort((a,b)=>getPath(a,f.sort)-getPath(b,f.sort)):list.slice();
  if(FEED_V.mode==="gps"){                           // 座標型:仿射轉換 + 貼齊路線
    const csrc=[],cdst=[],n=Math.min(stops.length,N);
    for(let i=0;i<n;i++){ const lo=getPath(stops[i],f.stopLon),la=getPath(stops[i],f.stopLat),es=STOPS[ORDER[i]];
      if(lo!=null&&la!=null&&es){ csrc.push([+lo,+la]); cdst.push([es.x,es.y]); } }
    if(csrc.length<3) return null;
    const t=solveAffine(csrc,cdst), blon=sv("busLon"), blat=sv("busLat");
    if(blon==null||blat==null) return null;
    const pt=applyAffine(t,+blon,+blat); return {dist:nearestDist(pt.x,pt.y)};
  }
  let seg=0; if(f.arrived){ for(let i=0;i<Math.min(stops.length,N);i++) if(getPath(stops[i],f.arrived)) seg=i; }
  if(FEED_V.mode==="eta"){                            // 到站秒數型:時間配速
    const nxt=stops[seg+1]||stops[stops.length-1]; let eta=+getPath(nxt,f.eta);
    if(FEED_V.etaType==="epoch"){ const now=f.now?+sv("now"):(Date.now()/1000); eta=eta-now; }
    return {seg, eta:Math.max(0,eta||0)};
  }
  let p=0;
  if(FEED_V.mode==="distance"){ const cur=stops[seg],nxt=stops[seg+1]||stops[stops.length-1];
    const segLen=Math.max(1,getPath(nxt,f.distStop)-getPath(cur,f.distStop)); p=1-(getPath(nxt,f.distNext)/segLen); }
  else if(FEED_V.mode==="percent"){ let pv=getPath(stops[seg],f.percent); if(pv>1)pv/=100; p=pv||0; }
  return {seg,p:Math.max(0,Math.min(1,p))};
}
async function poll(){
  try{
    const samples={};
    await Promise.all(FEEDS_V.map(f=>fetch(f.url).then(r=>r.json()).then(j=>{samples[f.id]=j;}).catch(()=>{})));
    const primaryRes=samples[FEED_V.primary]; if(!primaryRes) return;
    const srcMap=FEED_V.src||{}, f=FEED_V.fields||{};
    const sv=k=>{ const sid=srcMap[k]||FEED_V.primary; const s=samples[sid]; return s?getPath(s,f[k]):undefined; };
    if(f.success && !sv("success")) return;
    const r=feedCompute(primaryRes, sv, samples); if(!r) return;
    const bus=buses[0];
    if(f.plate){ const pl=sv("plate"); if(pl!=null){ bus.plate=String(pl); if(bus.plateEl) bus.plateEl.textContent=String(pl); } }
    if(r.dist!=null){ bus.gpsMode=true; bus.paceEta=false; bus.targetDist=r.dist; }                 // 座標型
    else if(r.eta!=null){ bus.gpsMode=false; bus.paceEta=true;                                        // 到站秒數型
      if(r.seg!==bus.seg){ bus.seg=r.seg; bus.p=0; pushLog(bus,'<span class="arr">已到站</span> '+STOPS[ORDER[r.seg]].name); } bus.eta=r.eta; }
    else { bus.gpsMode=false; bus.paceEta=false;                                                      // 站別/距離/百分比/自訂
      if(r.seg!==bus.seg){ bus.seg=r.seg; bus.p=r.p; pushLog(bus,'<span class="arr">已到站</span> '+STOPS[ORDER[r.seg]].name); } bus.targetP=r.p; }
  }catch(err){ /* 網路/CORS 失敗時靜默,下一輪再試 */ }
}
if(HAS_FEED){ poll(); setInterval(poll,5000); } else { buses.forEach(scheduleDepart); }

renderStatus(); requestAnimationFrame(frame);
</script>
</body>
</html>
