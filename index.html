<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公車即時動態</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1020;--panel:#121a30;--panel-2:#0e1526;--line:#22304f;--ink:#e7edfb;--ink-dim:#7f8fb5;--ink-faint:#4c5c82;
    --go:#ec2c8a;--back:#2aa9ff;--bus:#f9a825;--accent:#3ce0cf;--pin:#2b5c88;--live:#5fe08a;--warn:#ffb454;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;
    color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{width:300px;margin:0 auto;padding:36px 22px 60px;}
  .card{margin-bottom:16px;}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;}
  .legend{display:flex;gap:14px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:11px;}
  .legend i{width:16px;height:4px;border-radius:2px;}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);}
  .live b{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,224,138,.5)}70%{box-shadow:0 0 0 7px rgba(95,224,138,0)}100%{box-shadow:0 0 0 0 rgba(95,224,138,0)}}
  .stage{border-radius:11px;overflow:hidden;background:#dcdcdc;transition:border-radius .3s;}
  .stage.follow{aspect-ratio:1/1;}
  .stage.follow.shape-round{border-radius:30px;}
  .stage.follow.shape-circle{border-radius:5%; border: 6px solid #ccc;}
  svg.map{display:block;width:100%;height:auto;}
  .settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 6px 10px;}
  .seg{display:flex;background:#0a1122;border:1px solid var(--line);border-radius:9px;padding:3px;}
  .segbtn{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:5px 10px;border:none;background:none;color:var(--ink-dim);border-radius:6px;cursor:pointer;}
  .segbtn.on{background:var(--accent);color:#08111f;font-weight:600;}
  .go-line{fill:none;stroke:var(--go);stroke-width:11;stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .back-line{fill:none;stroke:var(--back);stroke-width:11;stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .lbl-link{display:none;}
  .stop-ring{stroke:#fff;stroke-width:4;transition:fill .3s;}
  .stop-core{fill:#fff;}
  .lbl-badge{fill:var(--pin);}
  .lbl-badge-num{font-family:"IBM Plex Mono";font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central;}
  .lbl-name{font-family:"Noto Sans TC";font-weight:700;fill:#17233f;paint-order:stroke;stroke:#f4f6fb;stroke-width:7;stroke-linejoin:round;dominant-baseline:middle;}
  .bus-core{fill:var(--bus);}
  .bus-num{font-family:"IBM Plex Mono";font-weight:600;fill:#3a2400;text-anchor:middle;}
  .status h2,.log h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);margin:2px 4px 12px;font-weight:500;}
  .srow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-top:1px solid #1a2540;}
  .srow:first-of-type{border-top:none;}
  .stag{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px;background:var(--bus);
    color:#3a2400;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;}
  .smeta{min-width:0;flex:1;} .sstate{font-size:14.5px;font-weight:700;}
  .ssub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .d-dwell{background:var(--live);} .d-run{background:var(--accent);} .d-near{background:var(--warn);}
  .log .lines{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.85;color:var(--ink-dim);max-height:150px;overflow:hidden;}
  .log .lines b{color:var(--ink);} .log .arr{color:var(--live);} .log .dep{color:var(--warn);}
</style>
</head>

          <path class="cls-1" d="M780.91,2038.78l-23.59-16.31c.93-1.35,23.48-33.55,85.08-76.1,35.61-24.6,77.26-47.82,123.77-69.03,57.88-26.38,123.56-49.72,195.22-69.36,307.54-84.29,747.01-194.67,751.42-195.77l6.98,27.82c-4.4,1.1-443.58,111.41-750.82,195.62-157.27,43.11-254.46,96.1-308.3,132.97-58.17,39.83-79.55,69.87-79.76,70.17Z"></path>

        <path id="backPath" class="back-line"></path>
        <path id="goPath" class="go-line"></path>

  </div>
  <div class="card status" style="display: none;"><h2>車輛狀態(由事件推得)</h2><div id="statusList"></div></div>
  <div class="card log" style="display: none;"><h2>事件流</h2><div class="lines" id="logLines"></div></div>
</div>
<script>
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");

const routeMode="split";
const COL={go:"#ec2c8a",back:"#2aa9ff",single:"#7c3aed"};
const VIEW_MODE="follow";
const FRAME_SHAPE="circle";
const FOLLOW_ZOOM=2;
const CORNER_R=40;
const STOPS={
  water:{x:705,y:256,lx:745,ly:214,nx:715,ny:214,name:"水湳轉運中心",num:"1"},
  park_o:{x:808,y:1343,lx:491,ly:1347,nx:760,ny:1343,name:"臺中中央公園(去)",num:"2"},
  wenhua:{x:1013,y:1877,lx:1082,ly:1895,nx:1052,ny:1895,name:"捷運文華高中站",num:"3"},
  park_r:{x:836,y:1345,lx:913,ly:1345,nx:883,ny:1345,name:"臺中中央公園(返)",num:"4"},
  green:{x:808,y:541,lx:575,ly:545,nx:754,ny:542,name:"臺中綠美圖",num:"5"},
  liming:{x:764,y:367,lx:863,ly:369,nx:833,ny:369,name:"黎明經貿路口(會展中心)",num:"6"},
};
const GO_PTS=[[693,261],[732,243],[900,556],[840,588],[868,683],[882,899],[890,1142],[815,1339],[796,1425],[786,1557],[1024,1560],[1061,1625],[1132,1828],[1012,1873]];
const BACK_PTS=[[1012,1874],[933,1909],[850,1958],[811,1683],[801,1558],[812,1426],[830,1345],[906,1145],[897,880],[884,685],[853,581],[730,386],[806,352],[798,339],[746,364],[691,261]];

// 站點順序:用 STOPS 的鍵順序,末端回到第一站收成環線
const ORDER=[...Object.keys(STOPS), Object.keys(STOPS)[0]];

function line(pts,r){
  if(!r||r<=0) return "M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
  let d="M "+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const lAB=Math.hypot(b[0]-a[0],b[1]-a[1])||1,lBC=Math.hypot(c[0]-b[0],c[1]-b[1])||1,rr=Math.min(r,lAB/2,lBC/2);
    const p1=[b[0]-(b[0]-a[0])/lAB*rr,b[1]-(b[1]-a[1])/lAB*rr],p2=[b[0]+(c[0]-b[0])/lBC*rr,b[1]+(c[1]-b[1])/lBC*rr];
    d+=" L "+p1[0].toFixed(1)+" "+p1[1].toFixed(1)+" Q "+b[0]+" "+b[1]+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d+" L "+pts[pts.length-1][0]+" "+pts[pts.length-1][1];
}
const goPath=document.getElementById("goPath");   goPath.setAttribute("d",line(GO_PTS,CORNER_R));
const backPath=document.getElementById("backPath"); backPath.setAttribute("d",line(BACK_PTS,CORNER_R));
const goLen=goPath.getTotalLength(),backLen=backPath.getTotalLength(),total=goLen+backLen;
function pointAtDist(dist){ if(dist<=goLen) return {p:goPath.getPointAtLength(dist),leg:"go"};
  return {p:backPath.getPointAtLength(Math.min(dist-goLen,backLen)),leg:"back"}; }

// 各站在環線上的弧長:沿環線單調前進搜尋最近點(自動解決去/返同區的歸屬)
const ORDER_DIST=(function(){
  const res=[]; let prev=0;
  ORDER.forEach((k,idx)=>{
    if(idx===0){res.push(0);prev=0;return;}
    if(idx===ORDER.length-1){res.push(total);return;}
    const s=STOPS[k]; let best=prev,bd=Infinity;
    for(let d=prev; d<=total; d+=6){ const q=pointAtDist(d).p; const dd=(q.x-s.x)*(q.x-s.x)+(q.y-s.y)*(q.y-s.y); if(dd<bd){bd=dd;best=d;} }
    res.push(best); prev=best;
  });
  return res;
})();

function applyColors(){
  const root=document.documentElement.style;
  if(routeMode==="single"){root.setProperty("--go",COL.single);root.setProperty("--back",COL.single);}
  else{root.setProperty("--go",COL.go);root.setProperty("--back",COL.back);}
  document.getElementById("legend").innerHTML = routeMode==="single"
    ? '<span><i style="background:var(--go)"></i>路線</span>'
    : '<span><i style="background:var(--go)"></i>去程</span><span><i style="background:var(--back)"></i>回程</span>';
}
function busColor(leg){ return routeMode==="single"?COL.single:(leg==="go"?COL.go:COL.back); }
applyColors();

// 站點:圓點 + 站名 + 號碼牌 合成單一群組(以圓點為錨,可整體縮放 → 固定大小)
const pinsG=document.getElementById("pins"),dotRings={},stopGroups={},FS=30,BADGE=36;
for(const k in STOPS){ const s=STOPS[k];
  const g=document.createElementNS(SVGNS,"g");
  const dx=s.lx-s.x,dy=s.ly-s.y,bx=s.nx-s.x,by=s.ny-s.y;
  const link=document.createElementNS(SVGNS,"line"); link.setAttribute("x1",dx);link.setAttribute("y1",dy);link.setAttribute("x2",0);link.setAttribute("y2",0);link.setAttribute("class","lbl-link");
  const nm=document.createElementNS(SVGNS,"text"); nm.setAttribute("class","lbl-name"); nm.setAttribute("x",dx);nm.setAttribute("y",dy);nm.setAttribute("font-size",FS);nm.setAttribute("text-anchor","start");nm.textContent=s.name;
  const badge=document.createElementNS(SVGNS,"circle"); badge.setAttribute("class","lbl-badge"); badge.setAttribute("cx",bx);badge.setAttribute("cy",by);badge.setAttribute("r",BADGE/2);
  const bn=document.createElementNS(SVGNS,"text"); bn.setAttribute("class","lbl-badge-num"); bn.setAttribute("x",bx);bn.setAttribute("y",by);bn.setAttribute("font-size",s.num.length>1?15:22);bn.textContent=s.num;
  const ring=document.createElementNS(SVGNS,"circle"); ring.setAttribute("class","stop-ring"); ring.setAttribute("r",18); ring.setAttribute("fill","var(--pin)");
  const core=document.createElementNS(SVGNS,"circle"); core.setAttribute("class","stop-core"); core.setAttribute("r",7);
  g.append(link,nm,badge,bn,ring,core);
  g.setAttribute("transform","translate("+s.x+","+s.y+")");
  pinsG.appendChild(g); dotRings[k]=ring; stopGroups[k]={g:g,x:s.x,y:s.y};
}

// ===== 小地圖(跟隨)模式 =====
const FULL_VB=svg.getAttribute("viewBox").split(/\s+/).map(Number);
const FOLLOW_ZOOM_V=(typeof FOLLOW_ZOOM!=="undefined")?FOLLOW_ZOOM:2.2;
const FOLLOW_S=FULL_VB[2]/FOLLOW_ZOOM_V, MARKER_K_FOLLOW=1;   // 視窗=全寬/倍率;標記隨縮放一起變大(與編輯器一致)
let viewMode="full",frameShape="rect",markerK=1;
const cam={x:FULL_VB[0]+FULL_VB[2]/2,y:FULL_VB[1]+FULL_VB[3]/2};
const lastBusPos={x:cam.x,y:cam.y};
const stageEl=document.querySelector(".stage");
function applyShape(){ stageEl.classList.remove("shape-round","shape-circle");
  if(viewMode==="follow"){ if(frameShape==="round")stageEl.classList.add("shape-round"); else if(frameShape==="circle")stageEl.classList.add("shape-circle"); } }
function applyMarkerScale(){ for(const k in stopGroups){const o=stopGroups[k];o.g.setAttribute("transform","translate("+o.x+","+o.y+") scale("+markerK+")");} }
function setView(mode){ viewMode=mode; stageEl.classList.toggle("follow",mode==="follow"); applyShape();
  if(mode==="follow"){markerK=MARKER_K_FOLLOW;cam.x=lastBusPos.x;cam.y=lastBusPos.y;} else {markerK=1;svg.setAttribute("viewBox",FULL_VB.join(" "));}
  applyMarkerScale(); }
frameShape=(typeof FRAME_SHAPE!=="undefined")?FRAME_SHAPE:"rect";
setView((typeof VIEW_MODE!=="undefined")?VIEW_MODE:"full");   // 依烤進來的設定套用

// ===== 事件驅動:公車只吃 已到站/已離站 =====
const CAP=0.82,CREEP=0.82/4.5;
function makeBus(id,seg){return {id,seg,phase:"dwell",p:0,arriving:false,eta:null};}
const buses=[makeBus("01",0)];   // 一台車;真實情況由資料動態產生
const busesG=document.getElementById("buses");
buses.forEach(b=>{ const g=document.createElementNS(SVGNS,"g");
  const ring=document.createElementNS(SVGNS,"circle"); ring.setAttribute("r",34);ring.setAttribute("fill","none");ring.setAttribute("stroke-width",6);
  const core=document.createElementNS(SVGNS,"circle"); core.setAttribute("class","bus-core");core.setAttribute("r",30);core.setAttribute("stroke","#fff");core.setAttribute("stroke-width",5);
  const num=document.createElementNS(SVGNS,"text"); num.setAttribute("class","bus-num");num.setAttribute("font-size",26);num.setAttribute("dominant-baseline","central");num.textContent=b.id;
  g.append(ring,core,num);busesG.appendChild(g);b.g=g;b.ring=ring;
});

// ★★★ 接真實資料的入口:onEvent(車, "ARRIVE"/"DEPART") 控站別;onEvent(車,"ETA",秒數) 控速率 ★★★
function onEvent(bus,type,value){
  if(type==="DEPART"){bus.phase="transit";bus.p=0;bus.arriving=false;}
  else if(type==="ARRIVE"){bus.arriving=true;}
  else if(type==="ETA"){bus.eta=value;}          // 預估到站秒數 → 控制行駛速率
  if(type!=="ETA") logEvent(bus,type);
}
/*
  真實串接範例(需自備後端 proxy 處理 TDX OAuth 與 CORS):
  async function poll(){
    const rows=await fetch("/api/a2?route=你的路線").then(r=>r.json());
    for(const r of rows){
      const idx=stopByTdxId[r.StopID]; if(idx==null) continue;
      const bus=busByPlate[r.PlateNumb]||=spawnBus(r.PlateNumb);
      bus.seg=idx;                          // 用絕對站別校正
      onEvent(bus, r.A2EventType==0?"ARRIVE":"DEPART");
    }
    // 另可從 EstimatedTimeOfArrival 取得各站預估秒數 → onEvent(bus,"ETA",秒數) 控制行駛速率
  }
  setInterval(poll,5000);
*/
// 目前用模擬事件流讓畫面動起來,接好真實資料後可整段移除
function scheduleDepart(bus){setTimeout(()=>{ onEvent(bus,"DEPART"); const T=rand(4,8); onEvent(bus,"ETA",T); scheduleArrive(bus,T); },rand(1600,3200));}
function scheduleArrive(bus,T){setTimeout(()=>{onEvent(bus,"ARRIVE");}, T*1000*rand(0.9,1.15));}
function rand(a,b){return a+Math.random()*(b-a);}
buses.forEach(scheduleDepart);

const logEl=document.getElementById("logLines"),logs=[];
function logEvent(bus,type){
  const now=new Date().toLocaleTimeString("zh-TW",{hour12:false});
  const key=type==="DEPART"?ORDER[bus.seg]:ORDER[(bus.seg+1)%(ORDER.length-1)];
  const lab=type==="DEPART"?'<span class="dep">已離站</span>':'<span class="arr">已到站</span>';
  logs.unshift(now+"  <b>["+bus.id+"]</b> "+lab+" "+STOPS[key].name);
  logs.length=Math.min(logs.length,8); logEl.innerHTML=logs.join("<br>");
}
function busDist(b){ const a=ORDER_DIST[b.seg],c=ORDER_DIST[b.seg+1];
  return b.phase==="dwell"?a:a+(c-a)*Math.min(1,b.p); }

const statusList=document.getElementById("statusList");
buses.forEach(b=>{ const row=document.createElement("div"); row.className="srow";
  row.innerHTML='<div class="stag">'+b.id+'</div><div class="smeta"><div class="sstate" id="st-'+b.id+'">—</div><div class="ssub" id="sub-'+b.id+'">—</div></div>';
  statusList.appendChild(row);
});
function renderStatus(){
  const active={},incoming={},N=ORDER.length-1;
  buses.forEach(b=>{ const here=ORDER[b.seg],next=ORDER[(b.seg+1)%N];
    const st=document.getElementById("st-"+b.id),sub=document.getElementById("sub-"+b.id);
    if(b.phase==="dwell"){st.innerHTML='<span class="dot d-dwell"></span>停靠中';sub.textContent=STOPS[here].name;active[here]=true;}
    else if(b.arriving||b.p>=0.92){st.innerHTML='<span class="dot d-near"></span>即將進站';sub.textContent="往 "+STOPS[next].name;incoming[next]=true;}
    else{st.innerHTML='<span class="dot d-run"></span>行駛中';sub.textContent="往 "+STOPS[next].name+(b.eta!=null?" · 約"+Math.ceil(b.eta)+"秒":"");}
  });
  for(const k in STOPS) dotRings[k].setAttribute("fill",active[k]?"#25a35a":incoming[k]?"#d98a2b":"var(--pin)");
}

let last=performance.now(),tick=0;
function frame(now){ const dt=Math.min((now-last)/1000,.05);last=now; const N=ORDER.length-1; let primary=null;
  buses.forEach(b=>{
    if(b.phase==="transit"){
      if(b.arriving){ b.p+=(1-b.p)*Math.min(1,dt*6)+dt*0.2;
        if(b.p>=0.999){b.seg=(b.seg+1)%N;b.phase="dwell";b.p=0;b.arriving=false;b.eta=null;scheduleDepart(b);} }
      else if(b.eta!=null){                          // 用預估時間配速:剩餘進度 / 剩餘秒數
        b.eta=Math.max(0,b.eta-dt);
        const remain=1-b.p, dp=b.eta>dt?remain*(dt/b.eta):remain;
        b.p=Math.min(0.97,b.p+dp);                   // 未收到到站前不完全進站
      }
      else b.p=Math.min(CAP,b.p+CREEP*dt);           // 沒 ETA 時退回定速緩靠
    }
    const r=pointAtDist(busDist(b)); b.g.setAttribute("transform","translate("+r.p.x+","+r.p.y+") scale("+markerK+")");
    b.ring.setAttribute("stroke",busColor(r.leg));
    if(b===buses[0]) primary=r.p;
  });
  if(primary){ lastBusPos.x=primary.x; lastBusPos.y=primary.y;
    if(viewMode==="follow"){
      cam.x+=(primary.x-cam.x)*Math.min(1,dt*4); cam.y+=(primary.y-cam.y)*Math.min(1,dt*4);
      let vx=cam.x-FOLLOW_S/2, vy=cam.y-FOLLOW_S/2;
      vx=FULL_VB[2]>FOLLOW_S?Math.max(FULL_VB[0],Math.min(FULL_VB[0]+FULL_VB[2]-FOLLOW_S,vx)):FULL_VB[0]+(FULL_VB[2]-FOLLOW_S)/2;
      vy=FULL_VB[3]>FOLLOW_S?Math.max(FULL_VB[1],Math.min(FULL_VB[1]+FULL_VB[3]-FOLLOW_S,vy)):FULL_VB[1]+(FULL_VB[3]-FOLLOW_S)/2;
      svg.setAttribute("viewBox",vx+" "+vy+" "+FOLLOW_S+" "+FOLLOW_S);
    }
  }
  tick+=dt; if(tick>0.25){renderStatus();tick=0;}
  requestAnimationFrame(frame);
}
renderStatus(); requestAnimationFrame(frame);
</script>
