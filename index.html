<!DOCTYPE html>
<html lang="en"><head >
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9,chrome=1,requiresActiveX=true" />
	<meta name="format-detection" content="telephone=no">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<link rel="stylesheet" href="css/css.css" />
	
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <title>水湳號自駕巴士預約系統平台</title>

    <script type="text/javascript">
	$(document).ready(function() {
	$('body').hide().fadeIn(500);
	});
	</script>
    <style>
    .map-box{position:relative;width:100%;aspect-ratio:1692/2007}
    .map-box iframe{width:100%;height:100%;border:0;pointer-events:none}
    .map-switch{position:absolute;top:12px;right:12px;display:flex;gap:4px;padding:4px;
    border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
    .map-switch button{width:66px;height:32px;border:0;border-radius:999px;cursor:pointer;
    font-size:15px;font-weight:900;background:transparent;color:#2765af}
    .map-switch button[data-mode="full"].on{background:#2765af;color:#fff}
    .map-switch button[data-mode="int"].on{background:#8f41ff;color:#fff}
        
    
      .marquee{
  width:100%;
  overflow:hidden;
  padding:0 0 0px 0;
    position: relative;
    top: -4px;
}

.marquee-text{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation: marquee 20s linear infinite;
}

@keyframes marquee{
  from{
    transform: translateX(0);
  }
  to{
    transform: translateX(-100%);
  }
}
        

    </style>
    
</head>
<body>
<div class="page">

<header class="header">
  <img src="images/logo.png" alt=""/>
</header>
<div class="marquee">
  <div class="marquee-text">
    本連結為預約系統概念測試，正式預約系統將於自駕巴士上路測試時另行公告。
  </div>
</div>
<div class="content">
<div class="banner">
<div class="swiper bannerSwiper" style="aspect-ratio: 1692 / 2007; width: 100%;">
    <div class="swiper-wrapper">
    <div class="swiper-slide">
      <div class="map-box">
        <iframe id="shuinanMap" src="map.html"></iframe>
        <div class="map-switch">
          <button type="button" data-mode="full" class="on">全程車</button>
          <button type="button" data-mode="int">區間車</button>
        </div>
      </div>
    </div>
      <div class="swiper-slide"><img src="images/banner2.jpg" alt=""/></div>
      <div class="swiper-slide"><img src="images/banner3.jpg" alt=""/></div>
    </div>
	<div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
 </div>
</div>
<div class="swiper-pagination"></div>
    
<div class="build1"><img src="images/build1.png" width="300"  alt=""/></div>
<div class="build2"><img src="images/build2.png" width="400"  alt=""/></div>
<div class="build3"><img src="images/build3.png" width="300"  alt=""/></div>
</div>

<div class="footer">

<div class="btn-area">
	<button class="btn-register" onClick="location.href='register.html'">註冊</button>
	<button class="btn-login" onClick="location.href='login.html'">登入</button>
</div>
<div class="organizers">
<span>主辦單位：臺中市政府交通局 ｜ 執行單位：勤崴國際</span>
<span class="service-info">服務電話：02-23630582 ｜ 服務時間：週一到週五 <span class="service-time">(10:00 - 17:00)</span> </span>
</div>
</div>

</div>
	
<script>
var swiper = new Swiper(".bannerSwiper", {
  loop: false,
  //autoplay:true,
  pagination: {
	el: ".swiper-pagination",
  },
 navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
});
    
    
  var mapFrame = document.getElementById('shuinanMap');
  document.querySelectorAll('.map-switch button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.map-switch button').forEach(function (b) {
        b.classList.toggle('on', b === btn);
      });
      mapFrame.contentWindow.postMessage({ type: 'shuinan-mode', mode: btn.dataset.mode }, '*');
    });
  });''
</script>
	
</body>
</html>
