	<style>
	/* ===== 列表 / 地圖 切換 ===== */
	.view-toggle{
		display:flex;
		width:max-content;
		margin:0 auto 12px;
		padding:4px;
		border-radius:999px;
		background:#364A56;
		gap:4px;
	}
	.view-toggle button{
		border:none;
		background:none;
		color:#cfd8ea;
		font-size:15px;
		font-weight:700;
		padding:7px 18px;
		border-radius:999px;
		cursor:pointer;
		transition:background .25s,color .25s;
	}
	.view-toggle button.on{
		background:#f9a825;
		color:#3a2700;
	}
	.view-panel{ display:none; }
	.view-panel.on{ display:block; animation:viewFade .35s ease; }
	@keyframes viewFade{ from{opacity:0;} to{opacity:1;} }

	/* 地圖 iframe:依 bus-live 的 SVG 比例 (1692 x 2007) 自動算高度 */
	.bus-live-frame{
		display:block;
		width:100%;
		aspect-ratio:1692 / 2007;
		border:0;
		border-radius:12px;
		background:#dcdcdc;
	}
	</style>
	
</head>

<script>
// ===== 列表 / 地圖 切換 =====
(function(){
    const btns   = document.querySelectorAll('.view-toggle button');
    const panels = { list: document.getElementById('view-list'), map: document.getElementById('view-map') };
    const frame  = document.getElementById('busLiveFrame');

    function showView(view){
        if(!panels[view]) view = 'list';
        btns.forEach(b => b.classList.toggle('on', b.dataset.view === view));
        Object.keys(panels).forEach(k => panels[k].classList.toggle('on', k === view));

        // 第一次切到地圖才載入 iframe,避免一開頁就多打一份 API
        if(view === 'map' && !frame.getAttribute('src')){
            frame.setAttribute('src', frame.dataset.src);
        }
        try{ localStorage.setItem('busView', view); }catch(e){}
    }

    btns.forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

    // 記住上次選的檢視
    let saved = 'list';
    try{ saved = localStorage.getItem('busView') || 'list'; }catch(e){}
    showView(saved);
})();
</script>
	
<script>
setInterval(() => {
    const busElements = document.querySelectorAll('.bus');
    const busData = [];

    // 1. 取得目前所有站點的 HTML 內容
    busElements.forEach(el => {
        busData.push(el.innerHTML);
    });

    // 2. 執行順移
    const lastData = busData.pop();
    busData.unshift(lastData);

    // 3. 找出車子現在所在的 index
    let outwardIndex = -1;
    busData.forEach((content, i) => {
        if (content.includes('bus-outward')) {
            outwardIndex = i;
        }
    });

    // 4. 重新渲染，並透過 visibility 控制顯示/隱藏
    busElements.forEach((el, index) => {
        // 先淡出
        el.style.opacity = 0;
        
        setTimeout(() => {
            // 先把內容塞進去（確保內容始終存在於 DOM 中）
            el.innerHTML = busData[index];

            // 判斷邏輯：
            // 如果車子在第一站 (index 0)，全部設為可見
            if (outwardIndex === 0) {
                el.style.visibility = 'visible';
            } else {
                // 如果目前的索引小於車子所在位置，設為隱藏 (但內容還在)
                if (index < outwardIndex) {
                    el.style.visibility = 'hidden';
                } else {
                    el.style.visibility = 'visible';
                }
            }
            
            // 再淡入
            el.style.opacity = 1;
        }, 200); 
    });

}, 2000); 
</script>
