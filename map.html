<script>
(function(){
  const svg=document.getElementById('map');
  const FULL=[0,0,1692,2007], ZOOM='424.341 39.115 575.902 683.118'.split(' ').map(Number);
  const el=id=>document.getElementById(id);
  const bFull=el('b-full'), bInt=el('b-int');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let mode='full', cur=FULL.slice(), anim=null, token=0;
  const setVB=v=>svg.setAttribute('viewBox',v.map(n=>n.toFixed(2)).join(' '));
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  function zoomTo(target,dur){
    return new Promise(res=>{
      cancelAnimationFrame(anim);
      if(reduce){cur=target.slice();setVB(cur);return res();}
      const from=cur.slice(),t0=performance.now();
      (function step(now){
        const t=Math.min(1,(now-t0)/dur),k=ease(t);
        cur=from.map((f,i)=>f+(target[i]-f)*k);setVB(cur);
        if(t<1)anim=requestAnimationFrame(step);else res();
      })(t0);
    });
  }
  function show(ids,on){ids.forEach(i=>el(i).classList.toggle('off',!on));}
  async function go(next){
    if(next===mode)return; mode=next; const my=++token;
    bFull.setAttribute('aria-pressed',next==='full');bInt.setAttribute('aria-pressed',next==='int');
    show(['route-full','leg-full','route-int','leg-int'],false);
    await wait(300); if(my!==token)return;
    await zoomTo(next==='int'?ZOOM:FULL,1000); if(my!==token)return;
    show(next==='int'?['route-int','leg-int']:['route-full','leg-full'],true);
  }
  // 網址加 #nobtn 時隱藏內建按鈕（改由外層頁面的按鈕控制）
  if(location.hash==='#nobtn') document.querySelector('.switch').hidden=true;
  // 接收外層頁面傳來的切換指令：{type:'shuinan-mode', mode:'full' 或 'int'}
  window.addEventListener('message',e=>{
    if(e.data&&e.data.type==='shuinan-mode'&&(e.data.mode==='full'||e.data.mode==='int')) go(e.data.mode);
  });
  bFull.addEventListener('click',()=>go('full'));
  bInt.addEventListener('click',()=>go('int'));
})();
</script>
