<style>
  :root{--bg:#0b1020;--panel:#121a30;--panel-2:#0e1526;--line:#22304f;--ink:#e7edfb;--ink-dim:#7f8fb5;--ink-faint:#4c5c82;
    --go:#ec2c8a;--back:#2aa9ff;--bus:#f9a825;--accent:#3ce0cf;--pin:#2b5c88;--live:#5fe08a;--warn:#ffb454;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 80% -10%,#16213f 0%,transparent 60%),var(--bg);
    color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:36px 22px 60px;}
  .card{background:linear-gradient(160deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);
    border-radius:18px;padding:12px;box-shadow:0 24px 60px -30px rgba(0,0,0,.9);margin-bottom:16px;}
  .card.bare{background:none;border:none;border-radius:0;padding:0;box-shadow:none;margin:0;}
  body.map-only{background:none;}
  body.map-only .wrap{max-width:none;padding:0;margin:0;}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;}
  .legend{display:flex;gap:14px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:11px;}
  .legend i{width:16px;height:4px;border-radius:2px;}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--live);}
  .live b{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,224,138,.5)}70%{box-shadow:0 0 0 7px rgba(95,224,138,0)}100%{box-shadow:0 0 0 0 rgba(95,224,138,0)}}
  .stage{border-radius:11px;overflow:hidden;background:#dcdcdc;transition:border-radius .3s;}
  .stage.follow{max-width:100%;}
  .stage.follow.shape-round{border-radius:30px;}
  .stage.follow.shape-circle{border-radius:50%;}
  svg.map{display:block;width:100%;height:auto;}
  .settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 6px 10px;}
  .seg{display:flex;background:#0a1122;border:1px solid var(--line);border-radius:9px;padding:3px;}
  .segbtn{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:5px 10px;border:none;background:none;color:var(--ink-dim);border-radius:6px;cursor:pointer;}
  .segbtn.on{background:var(--accent);color:#08111f;font-weight:600;}
  .go-line{fill:none;stroke:var(--go);stroke-width:var(--line-w,11);stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .back-line{fill:none;stroke:var(--back);stroke-width:var(--line-w,11);stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .rline{fill:none;stroke-width:var(--line-w,11);stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:8;}
  .route,.stopg{transition:opacity .4s;}
  .d-off{background:var(--ink-faint);}
  .lbl-link{display:none;}
  .stop-ring{stroke:#fff;stroke-width:4;transition:fill .3s;}
  .stop-core{fill:#fff;}
  .lbl-badge{fill:var(--pin);}
  .lbl-badge-num{font-family:"IBM Plex Mono";font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central;}
  .lbl-name{font-family:"Noto Sans TC";font-weight:700;fill:#17233f;paint-order:stroke;stroke:#f4f6fb;stroke-width:7;stroke-linejoin:round;dominant-baseline:middle;}
  .bus-core{fill:var(--bus);}
  .bus-pulse{transform-box:fill-box;transform-origin:center;animation:busPulse 2s ease-out infinite;}
  @keyframes busPulse{0%{transform:scale(1);opacity:.45;}70%{opacity:0;}100%{transform:scale(2.6);opacity:0;}}
  .bus-num{font-family:"IBM Plex Mono";font-weight:600;/*fill:#3a2400;*/text-anchor:middle;}
  .bus-plate{font-family:"IBM Plex Mono";font-weight:600;fill:#17233f;paint-order:stroke;stroke:#f4f6fb;stroke-width:8;stroke-linejoin:round;}
  .status h2,.log h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);margin:2px 4px 12px;font-weight:500;}
  .srow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-top:1px solid #1a2540;}
  .srow:first-of-type{border-top:none;}
  .stag{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px;background:var(--bus);
    color:#3a2400;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;}
  .smeta{min-width:0;flex:1;} .sstate{font-size:14.5px;font-weight:700;}
  .ssub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .d-dwell{background:var(--live);} .d-run{background:var(--accent);} .d-near{background:var(--warn);}
  .log .lines{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.85;color:var(--ink-dim);max-height:150px;overflow:hidden;}
  .log .lines b{color:var(--ink);} .log .arr{color:var(--live);} .log .dep{color:var(--warn);}
</style>
</head>

const FEED_URL="https://wa-smart-busstop-v2.azurewebsites.net/api/Phase4/getCmServiceBus?licsno=PA4";
const FEED={"mode":"distance","listPath":"data.goThrouth","fields":{"sort":"sort","stopId":"stopId","stopName":"stopName","arrived":"arrived","distNext":"distanceToStop","distStop":"distanceToNextPoint","percent":"","eta":"estEpoch","stopLat":"lat","stopLon":"lon","busLat":"","busLon":"","now":"data.epochtime","plate":"data.id","success":"isSuccess"},"etaType":"epoch","distAlgo":"segment","onNoMatch":"best"};

  wenhua:{x:1013,y:1877,lx:1090,ly:1900,nx:1060,ny:1900,name:"捷運文華高中站",num:"3",apiId:"16620"},

  liming:{x:764,y:367,lx:871,ly:370,nx:841,ny:370,name:"黎明經貿路口(會展中心)",num:"6",apiId:"16623"},
};
const ROUTES=[
  {name:"路線1",mode:"split",col:{"go":"#ec2c8a","back":"#2aa9ff","single":"#7c3aed"},
   go:[[693,261],[732,243],[900,556],[840,588],[868,683],[882,899],[890,1142],[815,1339],[796,1425],[786,1557],[1024,1560],[1061,1625],[1132,1828],[1012,1873]],

  {name:"路線2",mode:"single",col:{"go":"#ec2c8a","back":"#2aa9ff","single":"#a921c4"},
   go:[[710,257],[729,241],[900,557],[853,581],[731,390],[807,346],[800,335],[745,365],[692,266],[710,257]],
   back:[],
   stops:["water","green","liming","water"],cond:null},
];

function feedDecide(res, C, nowSec){   // 共用判斷核心(編輯器測試與產生頁面用同一份):路線比對 + 定位
  const gp=(o,p)=>{ if(!p) return undefined; return String(p).split(".").reduce((a,k)=>(a==null?undefined:a[k]),o); };
  const num=v=>(v==null||v===""||isNaN(+v))?null:+v;
  const truthy=v=>v===true||v===1||v==="1"||(typeof v==="string"&&v.toLowerCase()==="true");
  const F=C.feed||{}, f=F.fields||{}, routes=C.routes||[], mode=F.mode||"distance";
  const list=F.listPath?gp(res,F.listPath):undefined;
  const needList=mode!=="custom";
  if(needList&&!Array.isArray(list)) return {state:"nolist"};
  const stops=Array.isArray(list)?list.slice():[];
  if(f.sort) stops.sort((a,b)=>(num(gp(a,f.sort))||0)-(num(gp(b,f.sort))||0));
  if(needList&&!stops.length) return {state:"empty"};
  const ids=stops.map(s=>{ const v=f.stopId?gp(s,f.stopId):undefined; return v==null?null:String(v); });
  const keyOf={}, api=C.api||{};
  for(const k in api){ const a=api[k]; if(a!=null&&a!=="") keyOf[String(a)]=k; }
  const keys=ids.map(id=>(id!=null&&keyOf[id]!==undefined)?keyOf[id]:null);
  const mapped=!!f.stopId&&Object.keys(keyOf).length>0;
  const condOk=r=>!r.cond||!r.cond.path||String(gp(res,r.cond.path))===String(r.cond.value);
  let route=-1, exact=false;
  if(stops.length){
    if(mapped){
      for(let i=0;i<routes.length;i++){ const r=routes[i];
        if(condOk(r)&&r.stops.length===keys.length&&r.stops.every((k,j)=>k===keys[j])){ route=i; exact=true; break; } }
      if(route<0){ const nm=F.onNoMatch||"best";
        if(nm==="best"){ let bs=0; const ks=new Set(keys.filter(Boolean));
          routes.forEach((r,i)=>{ if(!condOk(r)) return; const set=new Set(r.stops); let sc=0; ks.forEach(k=>{ if(set.has(k)) sc++; }); if(sc>bs){ bs=sc; route=i; } });
          if(bs<2) route=-1; }
        else if(nm==="last"&&C.prevRoute!=null&&routes[C.prevRoute]) route=C.prevRoute;
      }
      if(route<0&&mode!=="custom") return {state:"nomatch",ids,keys};
    } else { route=routes.findIndex(condOk); if(route<0) route=0; exact=true; }   // 尚未設定站點對應:沿用「第幾筆=第幾站」
  }
  if(route<0) route=Math.max(0,routes.findIndex(condOk));
  const R=routes[route]||{stops:[]}, Lr=R.stops.length, La=stops.length;
  let s=0;                                                   // 目前所在 = 最後一個已過站
  if(f.arrived) for(let i=0;i<La;i++) if(truthy(gp(stops[i],f.arrived))) s=i;
  if(La>=2) s=Math.min(s,La-2);
  let from=0, to=1;
  if(exact||!La){ from=Math.min(s,Math.max(0,Lr-2)); to=Math.min(from+1,Math.max(0,Lr-1)); }
  else {                                                     // 部分符合:用站點代碼找出在這條路線上的位置
    const ck=keys[s], nk=keys[s+1], occ=k=>R.stops.map((x,j)=>x===k?j:-1).filter(j=>j>=0);
    const rel=La>1?s/(La-1):0, relOf=j=>j/Math.max(1,Lr-1);
    let j=-1; if(ck) occ(ck).forEach(c=>{ if(j<0||Math.abs(relOf(c)-rel)<Math.abs(relOf(j)-rel)) j=c; });
    let t=-1; if(nk){ const o=occ(nk).filter(x=>x>j); if(o.length) t=o[0]; }
    if(j<0&&t>=0) j=Math.max(0,t-1);
    if(j<0) return mode==="custom"?{state:"error",msg:"找不到目前站點"}:{state:"nomatch",ids,keys};
    if(t<0) t=Math.min(j+1,Math.max(0,Lr-1));
    from=j; to=t;
  }
  const out={state:"ok",route,from,to,p:0,exact,ids,keys,apiIndex:s};
  const cur=stops[s], nxt=stops[s+1]||stops[La-1];
  if(mode==="custom"){
    try{ const fn=new Function("res","primary","sources",F.transform||"return null;"); const r=fn(res,res,{});
      if(!r||r.seg==null) return {state:"error",msg:"自訂函式沒有回傳 seg"};
      if(r.route!=null){ const ri=typeof r.route==="number"?r.route:(C.routeNames||[]).indexOf(String(r.route)); if(ri>=0&&routes[ri]) out.route=ri; }
      out.from=+r.seg; out.to=r.to!=null?+r.to:out.from+1; out.p=Math.max(0,Math.min(1,+r.p||0)); return out;
    }catch(e){ return {state:"error",msg:e.message}; }
  }
  if(mode==="gps"){ const controls=[];
    stops.forEach((st,i)=>{ const lo=num(gp(st,f.stopLon)), la=num(gp(st,f.stopLat)), k=mapped?keys[i]:R.stops[i]; if(lo!=null&&la!=null&&k) controls.push({key:k,lon:lo,lat:la}); });
    const blon=num(gp(res,f.busLon)), blat=num(gp(res,f.busLat));
    if(blon==null||blat==null) return {state:"error",msg:"找不到車輛經緯度"};
    if(controls.length<3) return {state:"error",msg:"校正控制點不足(需 ≥3 站有經緯度)"};
    out.gps={lon:blon,lat:blat,controls}; return out;
  }
  if(mode==="eta"){ let e=num(gp(nxt,f.eta)); if(e==null) return {state:"error",msg:"找不到下一站的到站時間"};
    if(F.etaType==="epoch"){ const n=f.now?num(gp(res,f.now)):null; e=e-(n!=null?n:nowSec); }
    out.eta=Math.max(0,e); return out;
  }
  if(mode==="distance"){
    if(F.distAlgo==="segment"){ const rem=num(gp(nxt,f.distNext)), len=num(gp(nxt,f.distStop));
      if(rem==null||len==null) return {state:"error",msg:"找不到下一站的剩餘距離或段長"};
      out.p= rem<0 ? 1 : 1-rem/Math.max(1,len); }
    else { const a=num(gp(cur,f.distStop)), b=num(gp(nxt,f.distStop)), dn=num(gp(nxt,f.distNext));
      if(a==null||b==null||dn==null) return {state:"error",msg:"找不到距離欄位"};
      out.p=1-dn/Math.max(1,b-a); }
  } else if(mode==="percent"){ let pv=num(gp(cur,f.percent)); if(pv==null) pv=0; if(pv>1) pv/=100; out.p=pv; }
  out.p=Math.max(0,Math.min(1,out.p||0));
  return out;
}

function line(pts,r){
  if(!pts||pts.length<2) return "";
  if(!r||r<=0) return "M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
  let d="M "+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const lAB=Math.hypot(b[0]-a[0],b[1]-a[1])||1,lBC=Math.hypot(c[0]-b[0],c[1]-b[1])||1,rr=Math.min(r,lAB/2,lBC/2);
    const p1=[b[0]-(b[0]-a[0])/lAB*rr,b[1]-(b[1]-a[1])/lAB*rr],p2=[b[0]+(c[0]-b[0])/lBC*rr,b[1]+(c[1]-b[1])/lBC*rr];
    d+=" L "+p1[0].toFixed(1)+" "+p1[1].toFixed(1)+" Q "+b[0]+" "+b[1]+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d+" L "+pts[pts.length-1][0]+" "+pts[pts.length-1][1];
}

  const bp=document.createElementNS(SVGNS,"path"), gp=document.createElementNS(SVGNS,"path");
  bp.setAttribute("class","rline"); bp.setAttribute("stroke",cBack); bp.setAttribute("d",line(r.back,CORNER_R));
  gp.setAttribute("class","rline"); gp.setAttribute("stroke",cGo);   gp.setAttribute("d",line(r.go,CORNER_R));
  g.append(bp,gp); routesG.appendChild(g);
  const goLen=r.go.length>1?gp.getTotalLength():0, backLen=r.back.length>1?bp.getTotalLength():0;
  let order=(r.stops||[]).filter(k=>STOPS[k]); if(order.length<2) order=[...STOP_KEYS,STOP_KEYS[0]];
  return {g,goPath:gp,backPath:bp,goLen,backLen,total:goLen+backLen,order,cGo,cBack,name:r.name,mode:r.mode,cond:r.cond||null,od:[]};
});
function pointAtDist(ri,dist){ const R=RT[ri]; dist=Math.max(0,dist||0);
  if(dist<=R.goLen&&R.goLen>0) return {p:R.goPath.getPointAtLength(dist),leg:"go"};
  if(R.backLen>0) return {p:R.backPath.getPointAtLength(Math.min(dist-R.goLen,R.backLen)),leg:"back"};
  return {p:R.goPath.getPointAtLength(Math.min(dist,R.goLen)),leg:"go"}; }
// 各站在路線上的弧長:沿路線單調前進搜尋最近點(自動解決去/返同區的歸屬)
RT.forEach((R,ri)=>{ let prev=0;
  R.order.forEach((k,idx)=>{
    if(idx===0){ R.od.push(0); return; }
    if(idx===R.order.length-1&&k===R.order[0]){ R.od.push(R.total); return; }
    const s=STOPS[k]; let best=prev,bd=Infinity;
    for(let d=prev; d<=R.total; d+=6){ const q=pointAtDist(ri,d).p; const dd=(q.x-s.x)*(q.x-s.x)+(q.y-s.y)*(q.y-s.y); if(dd<bd){bd=dd;best=d;} }
    R.od.push(best); prev=best;
  });
});

    const R=RT[b.route], N=R.order.length-1;
    if(DATA_DRIVEN){
      if(b.gpsMode){ if(b.targetDist!=null){ if(b.dist==null)b.dist=b.targetDist; b.dist+=(b.targetDist-b.dist)*Math.min(1,dt*3); } b.phase="transit"; }
      else if(b.paceEta){ if(b.eta!=null){ b.eta=Math.max(0,b.eta-dt); const remain=1-b.p, dp=b.eta>dt?remain*(dt/b.eta):remain; b.p=Math.min(0.97,b.p+dp); }
        b.phase=b.p<0.03?"dwell":"transit"; b.dist=busDist(b); }
      else { if(b.targetP!=null) b.p+=(b.targetP-b.p)*Math.min(1,dt*3); b.phase=b.p<0.03?"dwell":"transit"; b.dist=busDist(b); }
    } else if(b.phase==="transit"){
      if(b.arriving){ b.p+=(1-b.p)*Math.min(1,dt*6)+dt*0.2;
        if(b.p>=0.999){b.seg=(b.seg+1)%N;b.to=b.seg+1;b.phase="dwell";b.p=0;b.arriving=false;b.eta=null;scheduleDepart(b);} }
      else if(b.eta!=null){ b.eta=Math.max(0,b.eta-dt); const remain=1-b.p, dp=b.eta>dt?remain*(dt/b.eta):remain; b.p=Math.min(0.97,b.p+dp); }
      else b.p=Math.min(CAP,b.p+CREEP*dt);
      b.dist=busDist(b);
    } else b.dist=busDist(b);
    const r=pointAtDist(b.route,b.dist||0); b.g.setAttribute("transform","translate("+r.p.x+","+r.p.y+") scale("+(markerK*BUS_SCALE_V)+")");
    if(b.ring) b.ring.setAttribute("stroke",busColor(b.route,r.leg)); b.pulses.forEach(p=>p.setAttribute("fill",busColor(b.route,r.leg)));
    if(b.arrowEl){ const q=pointAtDist(b.route,Math.min(R.total,(b.dist||0)+6)).p, dx=q.x-r.p.x, dy=q.y-r.p.y;
      if(dx*dx+dy*dy>0.25){ const ang=Math.atan2(dy,dx)*180/Math.PI; if(b.heading==null)b.heading=ang; const dd=((ang-b.heading+540)%360)-180; b.heading+=dd*Math.min(1,dt*8); }
      if(b.heading!=null) b.arrowEl.setAttribute("transform","rotate("+b.heading.toFixed(1)+")"); }
    if(b===buses[0]) primary=r.p;
  });
  if(primary){ lastBusPos.x=primary.x; lastBusPos.y=primary.y;
    if(viewMode==="follow"){
      cam.x+=(primary.x-cam.x)*Math.min(1,dt*4); cam.y+=(primary.y-cam.y)*Math.min(1,dt*4);
      let vx=cam.x-winW/2, vy=cam.y-winH/2;
      vx=FULL_VB[2]>winW?Math.max(FULL_VB[0],Math.min(FULL_VB[0]+FULL_VB[2]-winW,vx)):FULL_VB[0]+(FULL_VB[2]-winW)/2;
      vy=FULL_VB[3]>winH?Math.max(FULL_VB[1],Math.min(FULL_VB[1]+FULL_VB[3]-winH,vy)):FULL_VB[1]+(FULL_VB[3]-winH)/2;
      svg.setAttribute("viewBox",vx+" "+vy+" "+winW+" "+winH);
    }
  }
  tick+=dt; if(tick>0.25){renderStatus();tick=0;}
  requestAnimationFrame(frame);
}

// ===== 資料來源:單一 API,依 FEED 設定解析;路線比對與定位由共用核心 feedDecide 決定 =====
const FEED_URL_V=(typeof FEED_URL!=="undefined")?FEED_URL:"";
const FEED_V=(typeof FEED!=="undefined")?FEED:null;
const HAS_FEED=!!FEED_URL_V&&!!FEED_V;
const DATA_DRIVEN=HAS_FEED;
function getPath(o,p){ if(!p) return undefined; return String(p).split(".").reduce((a,k)=>(a==null?undefined:a[k]),o); }
function solve3(M,b){ const A=M.map((r,i)=>[r[0],r[1],r[2],b[i]]);
  for(let i=0;i<3;i++){ let piv=i; for(let r=i+1;r<3;r++) if(Math.abs(A[r][i])>Math.abs(A[piv][i])) piv=r; const tmp=A[i];A[i]=A[piv];A[piv]=tmp;
    const d=A[i][i]||1e-9; for(let c=i;c<4;c++) A[i][c]/=d;
    for(let r=0;r<3;r++) if(r!==i){ const fct=A[r][i]; for(let c=i;c<4;c++) A[r][c]-=fct*A[i][c]; } }
  return [A[0][3],A[1][3],A[2][3]]; }
function solveAffine(src,dst){ const A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
  for(let i=0;i<src.length;i++){ const r=[src[i][0],src[i][1],1],X=dst[i][0],Y=dst[i][1];
    for(let a=0;a<3;a++){ for(let b=0;b<3;b++) A[a][b]+=r[a]*r[b]; bx[a]+=r[a]*X; by[a]+=r[a]*Y; } }
  const cx=solve3(A,bx),cy=solve3(A,by); return {ax:cx[0],bx:cx[1],cx:cx[2],ay:cy[0],by:cy[1],cy:cy[2]}; }
function applyAffine(t,lon,lat){ return {x:t.ax*lon+t.bx*lat+t.cx, y:t.ay*lon+t.by*lat+t.cy}; }
function nearestDist(ri,mx,my){ const R=RT[ri]; let best=0,bd=Infinity; for(let d=0;d<=R.total;d+=8){ const q=pointAtDist(ri,d).p; const dd=(q.x-mx)*(q.x-mx)+(q.y-my)*(q.y-my); if(dd<bd){bd=dd;best=d;} } return best; }
const CORE_CFG={feed:FEED_V, routes:RT.map(R=>({stops:R.order,cond:R.cond})), routeNames:RT.map(R=>R.name), api:{}};
for(const k in STOPS) CORE_CFG.api[k]=STOPS[k].apiId||"";

async function poll(){
  let res;
  try{ res=await fetch(FEED_URL_V,{cache:"no-store"}).then(r=>r.json()); }
  catch(err){ return; }                                         // 網路/CORS 失敗:維持現狀,下一輪再試
  try{
    const f=FEED_V.fields||{}, bus=buses[0];
    if(f.success&&!getPath(res,f.success)) return;
    if(f.plate){ const pl=getPath(res,f.plate); if(pl!=null){ bus.plate=String(pl); bus.plateEl.textContent=String(pl); } }
    CORE_CFG.prevRoute=bus.routeKnown?bus.route:null;
    const d=feedDecide(res,CORE_CFG,Date.now()/1000);
    if(d.state==="empty"||d.state==="nolist"){                   // 即時叫車 / 停班:沒有站點清單 → 隱藏公車
      if(!bus.hidden) pushLog(bus,'<span class="dep">無站點資料,隱藏車輛</span>(即時叫車/未營運)');
      setBusHidden(bus,true,"即時叫車 / 未營運"); return; }
    if(d.state==="nomatch"){
      if(!bus.hidden) pushLog(bus,'<span class="dep">沒有符合的路線,隱藏車輛</span>');
      setBusHidden(bus,true,"沒有符合的路線"); return; }
    if(d.state!=="ok") return;
    const wasHidden=bus.hidden; setBusHidden(bus,false);
    if(!bus.routeKnown||d.route!==bus.route){                    // 第一次定位或換路線(例如 大圈 → 小圈)
      const changed=bus.routeKnown&&d.route!==bus.route;
      bus.route=d.route; bus.routeKnown=true; bus.seg=d.from; bus.to=d.to; bus.p=d.p||0; bus.targetP=null; bus.dist=null; bus.heading=null;
      activeRoute=d.route; applyRouteDisplay();
      if(changed) pushLog(bus,'<span class="arr">切換路線</span> → '+escH(RT[d.route].name));
    } else if(wasHidden){ bus.seg=d.from; bus.to=d.to; bus.p=d.p||0; bus.dist=null; }
    const R=RT[bus.route];
    if(d.gps){
      const src=[],dst=[]; d.gps.controls.forEach(c=>{ const s=STOPS[c.key]; if(s){ src.push([c.lon,c.lat]); dst.push([s.x,s.y]); } });
      if(src.length<3) return;
      const pt=applyAffine(solveAffine(src,dst),d.gps.lon,d.gps.lat);
      bus.gpsMode=true; bus.paceEta=false; bus.targetDist=nearestDist(bus.route,pt.x,pt.y); return; }
    if(d.eta!=null){ bus.gpsMode=false; bus.paceEta=true;
      if(d.from!==bus.seg||d.to!==bus.to){ bus.seg=d.from; bus.to=d.to; bus.p=0; if(STOPS[R.order[d.from]]) pushLog(bus,'<span class="arr">已到站</span> '+escH(STOPS[R.order[d.from]].name)); }
      bus.eta=d.eta; return; }
    bus.gpsMode=false; bus.paceEta=false;
    if(d.from!==bus.seg||d.to!==bus.to){ bus.seg=d.from; bus.to=d.to; bus.p=d.p; if(STOPS[R.order[d.from]]) pushLog(bus,'<span class="arr">已到站</span> '+escH(STOPS[R.order[d.from]].name)); }
    bus.targetP=d.p;
  }catch(err){ /* 資料格式異常時略過這一輪 */ }
}
applyRouteDisplay();
if(HAS_FEED){ setBusHidden(buses[0],true,"等待資料"); poll(); setInterval(poll,5000); }
else { buses.forEach(scheduleDepart); }

renderStatus(); requestAnimationFrame(frame);
</script>
